# Copie este arquivo para "settings.yaml" (mesma pasta) e preencha com seus dados reais.
# "settings.yaml" está no .gitignore e nunca deve ser commitado.

emissor:
  # Usado só pra rotular o log de auditoria. No site, o emitente é o que
  # estiver logado (nfse.gov.br não tem campo de CNPJ na hora de emitir).
  # CNPJs conhecidos: Mateus 61.827.278/0001-21, Marcio 43.070.496/0001-82.
  cnpj: ""              # AJUSTAR: CNPJ de quem vai logar nesta execução
  razao_social: ""      # AJUSTAR: nome correspondente

plataforma:
  url_emissao: "https://www.nfse.gov.br/EmissorNacional/DPS/Pessoas/NovaNFSe"

servico_padrao:
  codigo_servico: "07.05.01"  # confirmado em 6 notas reais: reparação/conservação/reforma de edifícios
  descricao_padrao: ""        # texto padrão da discriminação do serviço, usado como sugestão no prompt
  ibs_cbs: "Não"               # nas últimas notas emitidas (inclusive a mais recente), IBS/CBS ficou em branco
  # ISSQN não entra aqui: pra CNPJ no Simples Nacional o site trava esses
  # campos sozinho, não tem o que configurar.

navegador:
  # Rode o Chrome manualmente antes com: chrome.exe --remote-debugging-port=9222
  # Loga na nfse.gov.br nessa janela, aí sim roda o script — ele conecta nela.
  debugger_address: "127.0.0.1:9222"
